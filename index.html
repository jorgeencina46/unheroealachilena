<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Héroe a la Chilena (El Documental)</title>
    <link rel="stylesheet" href="style.css">
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Contador de visitas en la esquina superior derecha -->
    <div class="contador-visitas">
        <span>👁️ Visitantes: </span><span id="numero-visitas">Cargando...</span>
    </div>

    <!-- PORTADA ÚNICA (Video de fondo) -->
    <header class="hero-section">
        <video autoplay loop muted playsinline class="video-fondo">
            <source src="img/fondo.mp4" type="video/mp4">
            Tu navegador no soporta videos HTML5.
        </video>
    </header>

    <!-- REDES SOCIALES (Esquina inferior derecha) -->
    <div class="redes-sociales">
        <a href="https://www.instagram.com/unsuperheroealachilena/" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="https://www.facebook.com/unsuperheroealachilena" target="_blank" title="Facebook"><i class="fab fa-facebook"></i></a>
        <a href="https://www.tiktok.com/@unsuperheroealachilena" target="_blank" title="TikTok"><i class="fab fa-tiktok"></i></a>
    </div>

    <script src="script.js"></script>
</body>
</html>
