<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Héroe a la Chilena (El Documental)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contador de visitas en la esquina superior derecha -->
    <div class="contador-visitas">
        <span>👁️ Visitantes: </span><span id="numero-visitas">Cargando...</span>
    </div>

    <!-- PORTADA ÚNICA (Video de fondo) -->
    <header class="hero-section">
        <video autoplay loop muted playsinline class="video-fondo">
            <!-- Asegúrate de que el nombre coincida con tu archivo -->
            <source src="img/fondo.mp4" type="video/mp4">
            Tu navegador no soporta videos HTML5.
        </video>
    </header>

    <script src="script.js"></script>
</body>
</html>
